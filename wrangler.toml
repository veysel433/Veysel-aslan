name = "veysel-aslan"
type = "javascript"
compatibility_date = "2026-05-15"

[env.production]
routes = [
  { pattern = "veysel-aslan.pages.dev", zone_name = "pages.dev" }
]

[build]
command = "npm install"
cwd = "./"

[build.upload]
format = "modules"

[[build.upload.rules]]
type = "CompiledContentType"
globs = ["**/*.wasm"]
fallthrough = true

[[build.upload.rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/*.js", "**/*.json"]
fallthrough = true
